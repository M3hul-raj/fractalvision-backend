name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractalvision
          POSTGRES_PASSWORD: fractalvision
          POSTGRES_DB: fractalvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fractalvision -d fractalvision"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Verify idempotent SQL migrations
        env:
          DATABASE_URL: postgresql://fractalvision:fractalvision@localhost:5432/fractalvision
        run: |
          python scripts/migrate.py
          python scripts/migrate.py

      - name: Run pytest suite
        env:
          DATABASE_URL: postgresql://fractalvision:fractalvision@localhost:5432/fractalvision
        run: pytest tests/ -v
